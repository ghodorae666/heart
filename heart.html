<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闪耀爱心 ❤️</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0a0a0f;
  overflow: hidden;
  font-family: Arial, sans-serif;
}
canvas {
  display: block;
  position: fixed;
  top: 0; left: 0;
}
#mainCanvas { z-index: 1; }
#particleCanvas { z-index: 2; }
</style>
</head>
<body>
<canvas id="mainCanvas"></canvas>
<canvas id="particleCanvas"></canvas>
<script>
// ── Main heart canvas ──
const main = document.getElementById('mainCanvas');
const ctx  = main.getContext('2d');

// ── Particle canvas ──
const pcvs = document.getElementById('particleCanvas');
const pctx = pcvs.getContext('2d');

let W, H;

function resize() {
  W = main.width  = pcvs.width  = window.innerWidth;
  H = main.height = pcvs.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ── Heart math ──
function heartX(t, scale) {
  return scale * 16 * Math.pow(Math.sin(t), 3);
}
function heartY(t, scale) {
  const c = Math.cos(t);
  return -scale * (13 * c - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
}

// ── Coord helpers ──
function heartPoints(scale, cx, cy, step = 0.02) {
  const pts = [];
  for (let t = 0; t <= Math.PI * 2; t += step) {
    pts.push({ x: cx + heartX(t, scale), y: cy + heartY(t, scale) });
  }
  return pts;
}

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

// ── Sparkle particles ──
const particles = [];
class Sparkle {
  constructor() { this.reset(true); }
  reset(initial = false) {
    // pick a random point near the heart surface
    const t = Math.random() * Math.PI * 2;
    const scale = heartScaleBase + (Math.random() - 0.5) * 8;
    this.anchorX = cx + heartX(t, scale);
    this.anchorY = cy + heartY(t, scale);
    // offset randomly off the surface
    this.x = this.anchorX + (Math.random() - 0.5) * 12;
    this.y = this.anchorY + (Math.random() - 0.5) * 12;
    if (initial) {
      this.age = Math.random() * 120;
      this.life = 40 + Math.random() * 80;
    } else {
      this.age = 0;
      this.life = 40 + Math.random() * 80;
    }
    const hues = [0, 340, 350, 10, 20, 330];
    this.hue   = hues[Math.floor(Math.random() * hues.length)];
    this.size  = 1 + Math.random() * 2.5;
    this.vx    = (Math.random() - 0.5) * 0.6;
    this.vy    = (Math.random() - 0.5) * 0.6 - 0.15;
    this.grav  = 0.003 + Math.random() * 0.005;
    this.trail = [];
  }
  update() {
    this.age++;
    this.trail.push({ x: this.x, y: this.y, a: this.alpha });
    if (this.trail.length > 6) this.trail.shift();
    this.x += this.vx;
    this.y += this.vy;
    this.vy += this.grav;
    this.vx *= 0.99;
    return this.age < this.life;
  }
  get alpha() {
    const p = this.age / this.life;
    return p < 0.15 ? p / 0.15 : p > 0.7 ? 1 - (p - 0.7) / 0.3 : 1;
  }
  get glow() { return this.alpha * 0.5; }
}

// ── Floating ambient particles ──
const ambients = [];
class Ambient {
  constructor() {
    this.reset(true);
  }
  reset(initial = false) {
    const r = heartRadius + 30 + Math.random() * 60;
    const a = Math.random() * Math.PI * 2;
    this.x = cx + Math.cos(a) * r;
    this.y = cy + Math.sin(a) * r;
    this.angle = a;
    this.radius = r;
    this.speed = 0.001 + Math.random() * 0.003;
    this.age = initial ? Math.random() * 200 : 0;
    this.life = 200 + Math.random() * 150;
    this.size = 0.5 + Math.random() * 1.5;
    this.hue = 340 + Math.random() * 30; // red-pink range
    this.drift = (Math.random() - 0.5) * 0.4;
    this.offset = (Math.random() - 0.5) * 20;
    this.baseR = r;
  }
  update(beat) {
    this.age++;
    this.angle += this.speed * beat;
    // subtle radial wobble
    const wobble = Math.sin(this.age * 0.02) * 5;
    this.x = cx + Math.cos(this.angle) * (this.baseR + wobble + this.offset * Math.sin(this.age * 0.01));
    this.y = cy + Math.sin(this.angle) * (this.baseR + wobble + this.offset * Math.sin(this.age * 0.01));
    this.y += Math.sin(this.age * 0.015) * 3;
    this.x += Math.cos(this.age * 0.01 + 1) * 2;
    return this.age < this.life;
  }
  get alpha() {
    const p = this.age / this.life;
    if (p < 0.1) return p / 0.1;
    if (p > 0.8) return 1 - (p - 0.8) / 0.2;
    return 0.3 + Math.sin(this.age * 0.05) * 0.2;
  }
}

// ── State ──
let heartScaleBase, cx, cy, heartRadius;
let beatPhase = 0;
let heartOutline = [];
let glowPoints = [];

function recalcHeart() {
  cx = W / 2;
  cy = H / 2 + 20;
  heartScaleBase = Math.min(W, H) * 0.13;
  heartRadius = heartScaleBase * 17;
  heartOutline = heartPoints(heartScaleBase, cx, cy, 0.03);

  // glow samples – fewer points, smoothed
  const raw = heartPoints(heartScaleBase, cx, cy, 0.04);
  glowPoints = raw.filter((_, i) => i % 2 === 0);
}
recalcHeart();
window.addEventListener('resize', recalcHeart);

// Populate particles
for (let i = 0; i < 180; i++) particles.push(new Sparkle());
for (let i = 0; i < 60; i++) ambients.push(new Ambient());

// ── Draw functions ──

function drawGlow(beat) {
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, heartRadius * 1.3);
  grad.addColorStop(0, `rgba(255, 50, 80, ${0.08 * beat})`);
  grad.addColorStop(0.4, `rgba(255, 30, 60, ${0.05 * beat})`);
  grad.addColorStop(0.7, `rgba(200, 20, 50, ${0.03 * beat})`);
  grad.addColorStop(1, 'rgba(200, 20, 50, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawHeart(beat) {
  const s = beat;
  // inner glow fill
  ctx.beginPath();
  const pts = heartPoints(heartScaleBase * s, cx, cy, 0.03);
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();

  // gradient fill
  const gx = cx, gy = cy - heartScaleBase * 8;
  const grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, heartRadius * s);
  grad.addColorStop(0, '#ff6b8a');
  grad.addColorStop(0.3, '#ff3366');
  grad.addColorStop(0.6, '#e61a4d');
  grad.addColorStop(0.85, '#b30033');
  grad.addColorStop(1, '#66001a');
  ctx.fillStyle = grad;
  ctx.fill();

  // outer glow stroke
  ctx.shadowColor = '#ff3366';
  ctx.shadowBlur = 30 * s;
  ctx.strokeStyle = `rgba(255, 80, 120, ${0.35 * s})`;
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // bright inner highlight
  ctx.beginPath();
  const inner = heartPoints(heartScaleBase * s * 0.7, cx, cy, 0.04);
  ctx.moveTo(inner[0].x, inner[0].y);
  for (let i = 1; i < inner.length; i++) ctx.lineTo(inner[i].x, inner[i].y);
  ctx.closePath();
  ctx.fillStyle = `rgba(255, 200, 210, ${0.06 * s})`;
  ctx.fill();
}

function drawSparkles(beat) {
  for (const p of particles) {
    const a = p.alpha * beat;
    if (a < 0.01) continue;

    // glow circle
    pctx.beginPath();
    pctx.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2);
    pctx.fillStyle = `hsla(${p.hue}, 100%, 70%, ${a * 0.15})`;
    pctx.fill();

    // star shape
    const sz = p.size * (0.8 + Math.sin(p.age * 0.2) * 0.3);
    pctx.save();
    pctx.translate(p.x, p.y);
    pctx.rotate(p.age * 0.05);
    // cross spark
    pctx.strokeStyle = `hsla(${p.hue}, 100%, 85%, ${a * 0.9})`;
    pctx.lineWidth = sz * 0.6;
    pctx.beginPath();
    pctx.moveTo(0, -sz * 4);
    pctx.lineTo(0, sz * 4);
    pctx.moveTo(-sz * 4, 0);
    pctx.lineTo(sz * 4, 0);
    pctx.stroke();
    // diagonal spark
    pctx.strokeStyle = `hsla(${p.hue}, 80%, 80%, ${a * 0.5})`;
    pctx.lineWidth = sz * 0.3;
    pctx.beginPath();
    pctx.moveTo(-sz * 2.5, -sz * 2.5);
    pctx.lineTo(sz * 2.5, sz * 2.5);
    pctx.moveTo(sz * 2.5, -sz * 2.5);
    pctx.lineTo(-sz * 2.5, sz * 2.5);
    pctx.stroke();
    pctx.restore();

    // center dot
    pctx.beginPath();
    pctx.arc(p.x, p.y, sz * 0.8, 0, Math.PI * 2);
    pctx.fillStyle = `hsla(${p.hue}, 100%, 95%, ${a})`;
    pctx.fill();
  }
}

function drawAmbients(beat) {
  for (const a of ambients) {
    const alpha = a.alpha * beat * 0.4;
    if (alpha < 0.01) continue;
    pctx.beginPath();
    pctx.arc(a.x, a.y, a.size, 0, Math.PI * 2);
    pctx.fillStyle = `hsla(${a.hue}, 80%, 75%, ${alpha})`;
    pctx.fill();

    // tiny glow
    pctx.beginPath();
    pctx.arc(a.x, a.y, a.size * 3, 0, Math.PI * 2);
    pctx.fillStyle = `hsla(${a.hue}, 80%, 70%, ${alpha * 0.08})`;
    pctx.fill();
  }
}

function drawFloatingEmbers() {
  // small ember dots floating upward
  for (let i = 0; i < 8; i++) {
    const t = Math.random() * Math.PI * 2;
    const r = heartRadius * 0.5 + Math.random() * heartRadius * 0.8;
    const x = cx + Math.cos(t) * r + (Math.random() - 0.5) * 20;
    const y = cy + Math.sin(t) * r + (Math.random() - 0.5) * 20;
    const sz = 0.3 + Math.random() * 0.8;
    const a = 0.1 + Math.random() * 0.3;
    pctx.beginPath();
    pctx.arc(x, y, sz, 0, Math.PI * 2);
    pctx.fillStyle = `rgba(255, 180, 200, ${a})`;
    pctx.fill();
  }
}

// ── Ray burst (occasional flash) ──
let rayFlash = 0;
function triggerRayFlash() {
  rayFlash = 1;
}

// ── Typography ──
function drawText(beat) {
  const text = '♥';
  const fs = Math.round(heartScaleBase * 3.2);
  ctx.font = `bold ${fs}px "Segoe UI", Arial, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = '#ff3366';
  ctx.shadowBlur = 20 * beat;
  ctx.fillStyle = `rgba(255, 255, 255, ${0.08 * beat})`;
  ctx.fillText(text, cx, cy + fs * 0.1);
  ctx.shadowBlur = 0;
}

// ── Corner rays ──
function drawRays(beat) {
  // light rays emanating from heart center when beating
  const alpha = Math.max(0, (beat - 0.85) * 2) * 0.15;
  if (alpha < 0.01) return;
  for (let i = 0; i < 36; i++) {
    const angle = (i / 36) * Math.PI * 2;
    const len = heartRadius * (1.5 + Math.sin(i * 3 + beatPhase * 2) * 0.3);
    const x1 = cx + Math.cos(angle) * heartRadius * 0.5;
    const y1 = cy + Math.sin(angle) * heartRadius * 0.5;
    const x2 = cx + Math.cos(angle) * len;
    const y2 = cy + Math.sin(angle) * len;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = `rgba(255, 100, 150, ${alpha * (0.3 + Math.sin(angle * 3) * 0.3)})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

// ── Heartbeat timing ──
let lastBeatTime = performance.now();
const BEAT_INTERVAL_MS = 900;

function getBeat(t) {
  const elapsed = t - lastBeatTime;
  const p = elapsed / BEAT_INTERVAL_MS;
  if (p > 1) {
    lastBeatTime = t;
    triggerRayFlash();
    return getBeat(t);
  }
  // beat curve: fast expansion, slower relaxation
  if (p < 0.12) {
    return 1 + 0.12 * Math.sin((p / 0.12) * Math.PI * 0.5);
  } else if (p < 0.25) {
    const pp = (p - 0.12) / 0.13;
    return 1 + 0.12 * Math.cos(pp * Math.PI * 0.5) * 0.6 + 0.04 * (1 - pp);
  } else if (p < 0.75) {
    const pp = (p - 0.25) / 0.5;
    return 1 + 0.02 * Math.sin(pp * Math.PI * 0.5);
  } else {
    const pp = (p - 0.75) / 0.25;
    return 1 - 0.01 * pp;
  }
}

// ── Main loop ──
function frame(t) {
  // clear canvases
  ctx.clearRect(0, 0, W, H);
  pctx.clearRect(0, 0, W, H);

  const beat = getBeat(t);

  // dim background
  ctx.fillStyle = 'rgba(10, 10, 15, 0.3)';
  ctx.fillRect(0, 0, W, H);

  // ambient glow
  drawGlow(beat);

  // corner rays
  drawRays(beat);

  // main heart
  drawHeart(beat);

  // text
  drawText(beat);

  // sparkles
  drawSparkles(beat);

  // ambient orbs
  drawAmbients(beat);

  // occasional floating dots
  if (beat > 0.98) drawFloatingEmbers();

  // ray flash overlay
  if (rayFlash > 0) {
    const a = rayFlash * 0.08;
    pctx.fillStyle = `rgba(255, 180, 200, ${a})`;
    pctx.fillRect(0, 0, W, H);
    rayFlash *= 0.92;
    if (rayFlash < 0.01) rayFlash = 0;
  }

  // update particles
  for (const p of particles) {
    if (!p.update()) {
      p.reset();
    }
  }
  for (const a of ambients) {
    if (!a.update(beat)) {
      a.reset();
    }
  }

  beatPhase += 0.02;

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
