<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Particle Heart Simulation - Strong Gradient</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #010103;
        }
        canvas {
            display: block;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x010103, 0.015);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 85);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;       
    controls.autoRotateSpeed = 1.0;   
    controls.enablePan = false;

    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        2.5,  
        0.5,  
        0.01  
    );
    const composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    const canvas = document.createElement('canvas');
    canvas.width = 32; canvas.height = 32;
    const ctx = canvas.getContext('2d');
    ctx.beginPath();
    ctx.arc(16, 16, 15, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    const particleTexture = new THREE.CanvasTexture(canvas);

    const DENSITY = 12000; 
    const colorCore = new THREE.Color(0x00e5ff); // 核心：电光蓝
    const colorEdge = new THREE.Color(0xd500ff); // 边缘：高纯度霓虹紫 (修正点1)

    const particleMaterial = new THREE.PointsMaterial({
        size: 0.6, 
        vertexColors: true,
        map: particleTexture,
        transparent: true,
        opacity: 0.9, 
        depthWrite: false,      
        blending: THREE.AdditiveBlending 
    });

    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(DENSITY * 3);
    const colors = new Float32Array(DENSITY * 3);

    let i = 0;
    const scale = 16; 

    while (i < DENSITY) {
        const x = (Math.random() - 0.5) * 3.5;
        const y = (Math.random() - 0.5) * 3.5;
        const z = (Math.random() - 0.5) * 3.5;
        
        const val = Math.pow(x*x + 2.25*z*z + y*y - 1, 3) - (x*x * y*y*y) - (0.1125 * z*z * y*y*y);

        if (val <= 0) {
            positions[i * 3] = x * scale;
            positions[i * 3 + 1] = y * scale;
            positions[i * 3 + 2] = z * scale;

            // 修正点2：重写渐变映射逻辑，强制增强边缘紫色
            const distFromCenter = Math.sqrt(x*x + y*y + z*z); 
            // Taubin心形的最大有效半径大约在1.05~1.2之间，将其归一化
            let mixRatio = Math.min(distFromCenter / 1.05, 1.0);
            
            // 使用指数曲线，让中心大部分保持纯蓝色，靠近边缘时突变至纯紫色
            mixRatio = Math.pow(mixRatio, 1.8);
            
            // 仅保留极小的随机波动 (10%)，确保渐变平滑不断层
            mixRatio = Math.min(mixRatio + Math.random() * 0.1, 1.0);
            
            const color = colorCore.clone().lerp(colorEdge, mixRatio);
            colors[i * 3] = color.r;
            colors[i * 3 + 1] = color.g;
            colors[i * 3 + 2] = color.b;

            i++;
        }
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const heartPoints = new THREE.Points(geometry, particleMaterial);
    scene.add(heartPoints);

    const ringDensity = 4000; 
    const ringGeo = new THREE.BufferGeometry();
    const ringPos = new Float32Array(ringDensity * 3);
    const ringColors = new Float32Array(ringDensity * 3);

    for(let j = 0; j < ringDensity; j++) {
        const t = Math.random() * Math.PI * 2;
        const radius = 25 + (Math.random() - 0.5) * 5; 
        
        ringPos[j * 3] = Math.cos(t) * radius;
        ringPos[j * 3 + 1] = -22 + (Math.random() - 0.5) * 0.8; 
        ringPos[j * 3 + 2] = Math.sin(t) * radius;

        // 星环颜色也根据新的高纯度主题随机分布
        const isCore = Math.random() > 0.4;
        const rColor = isCore ? colorCore : colorEdge;
        ringColors[j * 3] = rColor.r;
        ringColors[j * 3 + 1] = rColor.g;
        ringColors[j * 3 + 2] = rColor.b;
    }
    ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPos, 3));
    ringGeo.setAttribute('color', new THREE.BufferAttribute(ringColors, 3));
    
    const ringMat = particleMaterial.clone();
    ringMat.size = 0.4; 
    const ringPoints = new THREE.Points(ringGeo, ringMat);
    scene.add(ringPoints);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);
        
        const time = clock.getElapsedTime();
        
        if (heartPoints && ringPoints) {
            const scaleBounce = 1 + Math.sin(time * 5) * 0.03;
            heartPoints.scale.set(scaleBounce, scaleBounce, scaleBounce);
            
            heartPoints.rotation.y = Math.sin(time * 0.4) * 0.1;
            heartPoints.rotation.z = Math.cos(time * 0.2) * 0.05;

            ringPoints.rotation.y -= 0.004;
        }

        controls.update();
        composer.render(); 
    }

    animate();
</script>
</body>
</html>
